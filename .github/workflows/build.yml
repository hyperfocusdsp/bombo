name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Lint (ASCII-only string literals)
        run: python3 tools/check-no-utf8-strings.py

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            libcurl4-openssl-dev mesa-common-dev ninja-build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Stage Linux artefacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp -r build/Bombo_artefacts/Release/VST3/Bombo.vst3 dist/
          cp build/Bombo_artefacts/Release/Standalone/Bombo dist/Bombo-standalone

      - name: Stage macOS artefacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -R build/Bombo_artefacts/Release/VST3/Bombo.vst3 dist/
          if [ -d build/Bombo_artefacts/Release/AU/Bombo.component ]; then
            cp -R build/Bombo_artefacts/Release/AU/Bombo.component dist/
          fi
          # Ad-hoc sign so Gatekeeper at least lets the user override.
          codesign --force --deep --sign - dist/Bombo.vst3 || true
          if [ -d dist/Bombo.component ]; then
            codesign --force --deep --sign - dist/Bombo.component || true
          fi

      - name: Stage Windows artefacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/Bombo_artefacts/Release/VST3/Bombo.vst3 dist/

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Bombo-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
